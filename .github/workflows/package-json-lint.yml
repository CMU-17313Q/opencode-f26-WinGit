name: package.json lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-json-lint:
    name: package.json lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: tools/package-json-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: tools/package-json-lint/package-lock.json

      - name: Install npm-package-json-lint
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Lint workspace package.json files
        run: |
          mkdir -p reports
          npm run lint 2>&1 | tee reports/package-json-lint.log

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-json-lint-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: tools/package-json-lint/reports
