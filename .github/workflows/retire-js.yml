name: Retire.js

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "packages/*/package.json"
      - "packages/**/package.json"
      - "tools/retire-js/**"
      - ".github/workflows/retire-js.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "packages/**/package.json"
      - "tools/retire-js/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retire-js:
    name: Retire.js scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory: existing dependencies already have known findings, so this never blocks merges.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: tools/retire-js/package-lock.json

      - name: Install Retire.js
        working-directory: tools/retire-js
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Run Retire.js
        working-directory: tools/retire-js
        run: |
          mkdir -p reports
          npm run scan 2>&1 | tee reports/retire-scan.log
          node summarize.mjs reports/retire.json | tee -a "$GITHUB_STEP_SUMMARY" reports/summary.txt

      - name: Upload Retire.js report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retire-js-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: tools/retire-js/reports
